name: 📐 Skills

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check:
    name: Skills match the live server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 🔍 Validate the manifests
        run: |
          python3 -c "import json; json.load(open('.codex-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.app.json'))"
          python3 -c "import json; json.load(open('.agents/plugins/marketplace.json'))"

      - name: 📐 Compare the skills against the tools
        run: python3 scripts/check_skills.py

      - name: 📋 Summary
        if: always()
        run: |
          echo "### Skills ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "checked against https://mcp.stackin.io/mcp" >> "$GITHUB_STEP_SUMMARY"
