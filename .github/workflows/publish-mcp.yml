name: 📇 Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "Publishing version $VERSION"

      - name: 📦 Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: 🔑 Authenticate to the registry
        run: ./mcp-publisher login github-oidc

      - name: 📇 Publish
        run: ./mcp-publisher publish

      - name: ✅ Summary
        run: |
          {
            echo "### Published to the MCP Registry"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Name | \`$(jq -r .name server.json)\` |"
            echo "| Version | \`$(jq -r .version server.json)\` |"
            echo "| Endpoint | \`$(jq -r '.remotes[0].url' server.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
